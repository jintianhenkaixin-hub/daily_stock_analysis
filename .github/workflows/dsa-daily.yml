name: 每日股票分析

on:
  schedule:
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 运行模式
        required: true
        default: full
        type: choice
        options:
          - full
          - market-only
          - stocks-only
      force_run:
        description: 强制运行（跳过交易日检查）
        required: false
        default: false
        type: boolean

concurrency:
  group: stock-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 随机延迟
        run: sleep $((RANDOM % 60))

      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python 环境
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import futu; print('futu SDK import OK')"

      - name: 创建必要目录
        run: mkdir -p data logs reports

      - name: 执行股票分析
        env:
          TZ: Asia/Shanghai
          STOCK_LIST: '600519,300750,002594'
          STOCK_LIST_CONFIG: '600519,300750,002594'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: 'https://api.deepseek.com'
          OPENAI_MODEL: 'deepseek-chat'
          MARKET_REVIEW_REGION: cn
          MARKET_REVIEW_COLOR_SCHEME: red_up
          MARKET_REVIEW_ENABLED: 'true'
          REPORT_TYPE: simple
          MAX_WORKERS: '1'
        run: |
          MODE="${{ github.event.inputs.mode || 'full' }}"
          FORCE_RUN_ARG=""
          if [ "${{ github.event.inputs.force_run }}" = "true" ]; then
            FORCE_RUN_ARG="--force-run"
          fi
          echo "自选股: $STOCK_LIST"
          # 不配置任何推送渠道：仅生成报告文件，报告在工作流运行页的 Artifacts 中下载
          if [ "$MODE" = "market-only" ]; then
            python main.py --market-review --no-notify $FORCE_RUN_ARG
          elif [ "$MODE" = "stocks-only" ]; then
            python main.py --no-market-review --no-notify $FORCE_RUN_ARG
          else
            python main.py --no-notify $FORCE_RUN_ARG
          fi

      - name: 上传分析报告
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: analysis-reports-${{ github.run_number }}
          path: |
            reports/
            logs/
          retention-days: 30
