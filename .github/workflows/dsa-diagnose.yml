name: DSA 密钥诊断

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: 诊断 DeepSeek 密钥
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: 'https://api.deepseek.com'
        run: |
          echo "=== Key 基本信息（脱敏） ==="
          LEN=${#OPENAI_API_KEY}
          echo "key_length=$LEN"
          echo "key_prefix=${OPENAI_API_KEY:0:6}...${OPENAI_API_KEY: -4}"
          echo "has_leading_space=$([[ "$OPENAI_API_KEY" == " "* ]] && echo yes || echo no)"
          echo "has_trailing_space=$([[ "$OPENAI_API_KEY" == *" " ]] && echo yes || echo no)"

          echo "=== 直接调用 DeepSeek API ==="
          HTTP=$(curl -sS -o /tmp/ds_resp.json -w "%{http_code}" \
            -X POST "$OPENAI_BASE_URL/chat/completions" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"model":"deepseek-chat","messages":[{"role":"user","content":"ping"}],"max_tokens":5}')
          echo "http_status=$HTTP"
          echo "response_body:"
          cat /tmp/ds_resp.json
          echo ""

          echo "=== 查询账户余额（验证 Key 有效性）==="
          BAL=$(curl -sS -o /tmp/ds_bal.json -w "%{http_code}" \
            "$OPENAI_BASE_URL/user/balance" \
            -H "Authorization: Bearer $OPENAI_API_KEY")
          echo "balance_http_status=$BAL"
          cat /tmp/ds_bal.json
