name: DSA 密钥诊断

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: 诊断百炼可用模型
        env:
          DASHSCOPE_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          BASE="https://dashscope.aliyuncs.com/compatible-mode/v1"
          echo "=== 测试 chat/completions（候选模型）==="
          for M in qwen3.8-flash qwen-plus deepseek-v4.1-flash deepseek-v4-flash-0731 qwen3.8-max; do
            CODE=$(curl -sS -o /tmp/chat_resp.json -w "%{http_code}" \
              -X POST "$BASE/chat/completions" \
              -H "Authorization: Bearer $DASHSCOPE_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"model\":\"$M\",\"messages\":[{\"role\":\"user\",\"content\":\"ping\"}],\"max_tokens\":5}")
            MSG=$(python3 -c "import json;d=json.load(open('/tmp/chat_resp.json'));print(str(d.get('error',{}).get('message','OK'))[:150])" 2>/dev/null)
            echo "model=$M http=$CODE resp=$MSG"
          done
